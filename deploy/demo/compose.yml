name: zeit-demo

services:
  zeit-demo-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: zeit-web:${IMAGE_TAG:-local-demo}
    environment:
      API_UPSTREAM: zeit-demo-api:3001
      ROBOTS_NOINDEX: noindex
      # only the central caddy on this subnet may set x-forwarded-for
      EDGE_SUBNET: ${EDGE_SUBNET}
    networks:
      - edge
      - app
    read_only: true
    tmpfs:
      - /tmp
      - /data
      - /config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      zeit-demo-api:
        condition: service_healthy

  zeit-demo-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: zeit-api:${IMAGE_TAG:-local-demo}
    environment:
      APP_MODE: demo
      APP_ORIGIN: ${APP_ORIGIN}
      DATABASE_URL: postgres://zeit_app:${ZEIT_APP_PASSWORD}@zeit-demo-db:5432/zeit?sslmode=disable
      TRUSTED_PROXY: ${DEMO_APP_SUBNET}
      # optional in demo mode, config.ts falls back to fixed development values when empty
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
    networks:
      - app
      - db
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
    pids_limit: 100
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "require('node:http').get({host:'127.0.0.1',port:process.env.PORT||3001,path:'/api/health'},res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      zeit-demo-migrate:
        condition: service_completed_successfully

  zeit-demo-migrate:
    image: zeit-api:${IMAGE_TAG:-local-demo}
    command:
      [
        "dbmate",
        "--wait",
        "--url",
        "postgres://zeit_owner:${ZEIT_OWNER_PASSWORD}@zeit-demo-db:5432/zeit?sslmode=disable",
        "up"
      ]
    networks:
      # only needs the db, not app
      - db
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: "no"
    depends_on:
      zeit-demo-db:
        condition: service_healthy

  zeit-demo-db:
    image: postgres:17-alpine
    # as root the entrypoint needs chown and su-exec, both fail under cap_drop: ALL
    user: postgres
    environment:
      POSTGRES_DB: zeit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZEIT_OWNER_PASSWORD: ${ZEIT_OWNER_PASSWORD}
      ZEIT_APP_PASSWORD: ${ZEIT_APP_PASSWORD}
    volumes:
      - zeit-demo-db:/var/lib/postgresql/data
      - ../../db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # tcp on purpose: during init the socket-only temp server already passes pg_isready
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "zeit"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:?}
  app:
    internal: true
    ipam:
      config:
        - subnet: ${DEMO_APP_SUBNET}
  db:
    internal: true
    ipam:
      config:
        - subnet: ${DEMO_DB_SUBNET}

volumes:
  zeit-demo-db:
