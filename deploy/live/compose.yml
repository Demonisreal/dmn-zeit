name: zeit-live

services:
  zeit-live-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: zeit-web:${IMAGE_TAG:-local-live}
    environment:
      API_UPSTREAM: zeit-live-api:3001
      EDGE_SUBNET: ${EDGE_SUBNET:?}
    volumes:
      - zeit-live-access-log:/var/log/caddy
    networks:
      - edge
      - app
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
      - /data:size=16m,noexec,nosuid
      - /config:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      zeit-live-api:
        condition: service_healthy

  zeit-live-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: zeit-api:${IMAGE_TAG:-local-live}
    environment:
      APP_MODE: live
      APP_ORIGIN: ${APP_ORIGIN:?}
      DATABASE_URL: postgres://zeit_app:${ZEIT_APP_PASSWORD:?}@zeit-live-db:5432/zeit?sslmode=disable
      TRUSTED_PROXY: ${LIVE_APP_SUBNET:?}
      MAIL_FROM: ${MAIL_FROM:?}
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
    networks:
      - app
      - egress
      - db
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    pids_limit: 150
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "require('node:http').get({host:'127.0.0.1',port:process.env.PORT||3001,path:'/api/health'},res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      zeit-live-migrate:
        condition: service_completed_successfully

  zeit-live-migrate:
    image: zeit-api:${IMAGE_TAG:-local-live}
    environment:
      DATABASE_URL: postgres://zeit_owner:${ZEIT_OWNER_PASSWORD:?}@zeit-live-db:5432/zeit?sslmode=disable
    command: ["dbmate", "--wait", "--no-dump-schema", "up"]
    networks:
      - db
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: "no"
    depends_on:
      zeit-live-db:
        condition: service_healthy

  zeit-live-cli:
    image: zeit-api:${IMAGE_TAG:-local-live}
    profiles:
      - cli
    entrypoint: ["node", "dist/cli.js"]
    environment:
      APP_MODE: live
      APP_ORIGIN: ${APP_ORIGIN:?}
      DATABASE_URL: postgres://zeit_app:${ZEIT_APP_PASSWORD:?}@zeit-live-db:5432/zeit?sslmode=disable
      CLI_DATABASE_URL: postgres://zeit_owner:${ZEIT_OWNER_PASSWORD:?}@zeit-live-db:5432/zeit?sslmode=disable
      TRUSTED_PROXY: ${LIVE_APP_SUBNET:?}
      MAIL_FROM: ${MAIL_FROM:?}
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
    networks:
      - db
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      zeit-live-db:
        condition: service_healthy

  zeit-live-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    user: postgres
    command: ["postgres", "-c", "max_wal_size=256MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_DB: zeit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      ZEIT_OWNER_PASSWORD: ${ZEIT_OWNER_PASSWORD:?}
      ZEIT_APP_PASSWORD: ${ZEIT_APP_PASSWORD:?}
      ZEIT_BACKUP_PASSWORD: ${ZEIT_BACKUP_PASSWORD:?}
    volumes:
      - zeit-live-db:/var/lib/postgresql/data
      - ../../db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /var/run/postgresql:size=8m,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.5
    pids_limit: 150
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "zeit"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  zeit-live-backup:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles:
      - backup
    user: postgres
    environment:
      PGPASSWORD: ${ZEIT_BACKUP_PASSWORD:?}
    networks:
      - db
    command: ["pg_dump", "-h", "zeit-live-db", "-U", "zeit_backup", "-d", "zeit", "-Fc"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:?}
  app:
    internal: true
    ipam:
      config:
        - subnet: ${LIVE_APP_SUBNET:?}
  egress:
    ipam:
      config:
        - subnet: ${LIVE_EGRESS_SUBNET:?}
  db:
    internal: true
    ipam:
      config:
        - subnet: ${LIVE_DB_SUBNET:?}

volumes:
  zeit-live-db:
  zeit-live-access-log:
